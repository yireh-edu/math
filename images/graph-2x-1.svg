<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="두 점 (0, -1)과 (1, 1)을 지나는 직선의 그래프">
  <!-- 한 칸 = 1, 원점 (140,140), 한 칸 28px, x와 y 모두 -4 ~ 4 -->
  <rect width="280" height="280" fill="#ffffff"/>
  <g stroke="#e3e9f1" stroke-width="1">
    <path d="M28 0V280M56 0V280M84 0V280M112 0V280M168 0V280M196 0V280M224 0V280M252 0V280"/>
    <path d="M0 28H280M0 56H280M0 84H280M0 112H280M0 168H280M0 196H280M0 224H280M0 252H280"/>
  </g>
  <g stroke="#18212e" stroke-width="1.5">
    <path d="M0 140H272"/><path d="M140 280V8"/>
  </g>
  <path d="M272 140l-8-4v8zM140 8l-4 8h8z" fill="#18212e"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#18212e">
    <text x="266" y="158">x</text><text x="148" y="16">y</text><text x="128" y="156">O</text>
    <text x="164" y="156">1</text><text x="192" y="156">2</text><text x="220" y="156">3</text>
    <text x="104" y="156">-1</text><text x="76" y="156">-2</text>
    <text x="126" y="116">1</text><text x="126" y="88">2</text><text x="126" y="60">3</text>
    <text x="120" y="172">-1</text><text x="120" y="200">-2</text><text x="120" y="228">-3</text>
  </g>
  <!-- y = 2x - 1 : x=-1.5 → y=-4 (140-42, 252), x=2.5 → y=4 (210, 28) -->
  <path d="M98 252L210 28" stroke="#d2372a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="168" r="4.5" fill="#d2372a"/>
  <circle cx="168" cy="112" r="4.5" fill="#d2372a"/>
</svg>
